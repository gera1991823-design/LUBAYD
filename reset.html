<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Actualizar APP LUBAYD V7.4</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f8f4;font-family:Arial,sans-serif;color:#10261a}.card{width:min(460px,100%);padding:28px;border:1px solid #d7e7dc;border-radius:22px;background:#fff;box-shadow:0 18px 44px rgba(9,54,32,.1)}h1{margin-top:0}p{line-height:1.55;color:#68766e}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0b8f4f;color:#fff;font-weight:700;cursor:pointer}.note{margin-top:14px;font-size:12px}
  </style>
</head>
<body>
  <main class="card"><img src="./logo-original.png" alt="LUBAYD SA" style="display:block;width:150px;height:auto;margin:0 auto 18px">
    <h1>Actualizar APP LUBAYD V7.4</h1>
    <p>Este proceso elimina las versiones visuales guardadas en cache y conserva el PIN offline, las fotos y los registros pendientes almacenados en IndexedDB.</p>
    <button id="resetButton" type="button">Actualizar y abrir aplicacion</button>
    <p id="status" class="note"></p>
  </main>
  <script>
    document.getElementById('resetButton').addEventListener('click', async function(){
      const status=document.getElementById('status');status.textContent='Actualizando...';
      if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(reg){return reg.unregister();}));}
      const keys=await caches.keys();await Promise.all(keys.map(function(key){return caches.delete(key);}));
      status.textContent='Listo. Abriendo la aplicacion...';
      setTimeout(function(){location.replace('./?v=7.4.0&t='+Date.now());},450);
    });
  </script>
</body>
</html>
