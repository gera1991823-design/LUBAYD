<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06653c">
  <title>Actualizar APP LUBAYD</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;background:#f4f8f6;color:#12251b;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(460px,100%);padding:30px;border:1px solid #d8e5dd;border-radius:24px;background:#fff;box-shadow:0 22px 65px rgba(7,65,39,.13)}.mark{width:52px;height:52px;margin-bottom:18px;border-radius:16px;display:grid;place-items:center;background:#e7f5ed;color:#087545;font-size:25px;font-weight:900}h1{margin:0 0 10px;font-size:28px;line-height:1.15}p{margin:0 0 18px;color:#607269;line-height:1.55}.notice{padding:13px 14px;margin:0 0 20px;border-radius:14px;background:#f0f8f3;color:#315f48;font-size:14px}button{width:100%;min-height:52px;border:0;border-radius:14px;color:#fff;background:#087545;font:800 15px inherit;cursor:pointer;box-shadow:0 10px 24px rgba(8,117,69,.2)}button:disabled{opacity:.6;cursor:wait}small{display:block;margin-top:15px;color:#6b7c73;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">↻</div>
    <h1>Actualizar APP LUBAYD</h1>
    <p>Elimina la caché visual y el Service Worker anterior para cargar la versión más reciente.</p>
    <div class="notice"><strong>Importante:</strong> este proceso conserva el PIN, los Partes, las fotos y los descansos pendientes guardados en el dispositivo.</div>
    <button id="resetButton" type="button">Actualizar y abrir aplicación</button>
    <small id="status">Lista para actualizar.</small>
  </main>
  <script>
    document.getElementById('resetButton').addEventListener('click', async () => {
      const button = document.getElementById('resetButton');
      const status = document.getElementById('status');
      button.disabled = true;
      status.textContent = 'Actualizando archivos…';
      try {
        const registrations = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(registrations.map((registration) => registration.unregister()));
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      } catch (error) {
        console.warn(error);
      }
      location.replace('./?updated=' + Date.now());
    });
  </script>
</body>
</html>
